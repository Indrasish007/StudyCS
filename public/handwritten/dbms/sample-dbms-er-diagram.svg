<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <style>
    .bg { fill: #04081c; }
    .grid-line { stroke: #ffffff; stroke-opacity: 0.03; stroke-width: 1; }
    .edge { stroke: #06b6d4; stroke-width: 2; stroke-linecap: round; }
    .entity { fill: #162e3d; stroke: #06b6d4; stroke-width: 2.5; }
    .attribute { fill: #102a3a; stroke: #0891b2; stroke-width: 1.5; rx: 12; }
    .relationship { fill: #1f2e35; stroke: #0891b2; stroke-width: 2; }
    .text { fill: #f8fafc; font-family: 'Courier New', Courier, monospace; font-size: 11px; text-anchor: middle; font-weight: bold; }
    .title { fill: #06b6d4; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: bold; letter-spacing: 1.5px; }
    .commentary { fill: #94a3b8; font-family: 'Courier New', Courier, monospace; font-size: 11px; }
  </style>
  
  <rect width="100%" height="100%" class="bg" rx="16" />
  
  <!-- Grid -->
  <g>
    <line x1="50" y1="0" x2="50" y2="350" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="350" class="grid-line" />
    <line x1="250" y1="0" x2="250" y2="350" class="grid-line" />
    <line x1="350" y1="0" x2="350" y2="350" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="350" class="grid-line" />
    <line x1="0" y1="50" x2="500" y2="50" class="grid-line" />
    <line x1="0" y1="150" x2="500" y2="150" class="grid-line" />
    <line x1="0" y1="250" x2="500" y2="250" class="grid-line" />
  </g>

  <!-- Title -->
  <text x="30" y="40" class="title">DBMS: ENTITY RELATIONSHIP (ER) DIAGRAM</text>
  
  <!-- Connectors -->
  <line x1="120" y1="180" x2="70" y2="120" class="edge" />
  <line x1="120" y1="180" x2="120" y2="110" class="edge" />
  <line x1="120" y1="180" x2="250" y2="180" class="edge" />
  <line x1="250" y1="180" x2="380" y2="180" class="edge" />
  <line x1="380" y1="180" x2="380" y2="110" class="edge" />
  <line x1="380" y1="180" x2="430" y2="120" class="edge" />

  <!-- Entities (Rectangles) -->
  <!-- Student Entity -->
  <rect x="60" y="160" width="120" height="40" class="entity" />
  <text x="120" y="184" class="text">STUDENT</text>
  
  <!-- Course Entity -->
  <rect x="320" y="160" width="120" height="40" class="entity" />
  <text x="380" y="184" class="text">COURSE</text>

  <!-- Relationship (Diamond) -->
  <polygon points="250,155 285,180 250,205 215,180" class="relationship" />
  <text x="250" y="184" class="text">Enrolls</text>
  <text x="195" y="174" class="text">1</text>
  <text x="305" y="174" class="text">N</text>

  <!-- Attributes (Ovals) -->
  <!-- Student attributes -->
  <rect x="20" y="90" width="80" height="24" class="attribute" />
  <text x="60" y="105" class="text"><u>Roll No</u></text>
  
  <rect x="110" y="80" width="80" height="24" class="attribute" />
  <text x="150" y="95" class="text">Name</text>

  <!-- Course attributes -->
  <rect x="310" y="80" width="80" height="24" class="attribute" />
  <text x="350" y="95" class="text"><u>Course ID</u></text>
  
  <rect x="400" y="90" width="80" height="24" class="attribute" />
  <text x="440" y="105" class="text">Credits</text>

  <!-- Commentary -->
  <text x="30" y="295" class="commentary">// Cardinality Ratio: 1-to-N (One Student, Multiple Course Enrollments)</text>
  <text x="30" y="310" class="commentary">// Primary Keys are underlined (Roll No, Course ID)</text>
</svg>
