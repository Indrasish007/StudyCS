<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <style>
    .bg { fill: #08041d; }
    .grid-line { stroke: #ffffff; stroke-opacity: 0.03; stroke-width: 1; }
    .edge { stroke: #818cf8; stroke-width: 2.5; stroke-dasharray: 4 2; stroke-linecap: round; }
    .node-bg { fill: #1e1b4b; stroke: #6366f1; stroke-width: 2.5; }
    .node-text { fill: #f8fafc; font-family: 'Courier New', Courier, monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .title { fill: #818cf8; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: bold; letter-spacing: 1.5px; }
    .commentary { fill: #94a3b8; font-family: 'Courier New', Courier, monospace; font-size: 11px; }
  </style>
  
  <!-- Blueprint Background -->
  <rect width="100%" height="100%" class="bg" rx="16" />
  
  <!-- Grid Pattern -->
  <g>
    <line x1="50" y1="0" x2="50" y2="350" class="grid-line" />
    <line x1="100" y1="0" x2="100" y2="350" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="350" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="350" class="grid-line" />
    <line x1="250" y1="0" x2="250" y2="350" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="350" class="grid-line" />
    <line x1="350" y1="0" x2="350" y2="350" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="350" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="350" class="grid-line" />
    
    <line x1="0" y1="50" x2="500" y2="50" class="grid-line" />
    <line x1="0" y1="100" x2="500" y2="100" class="grid-line" />
    <line x1="0" y1="150" x2="500" y2="150" class="grid-line" />
    <line x1="0" y1="200" x2="500" y2="200" class="grid-line" />
    <line x1="0" y1="250" x2="500" y2="250" class="grid-line" />
    <line x1="0" y1="300" x2="500" y2="300" class="grid-line" />
  </g>

  <!-- Title -->
  <text x="30" y="40" class="title">STRUCTURE: BINARY SEARCH TREE (BST)</text>
  
  <!-- Edges -->
  <line x1="250" y1="80" x2="150" y2="160" class="edge" />
  <line x1="250" y1="80" x2="350" y2="160" class="edge" />
  
  <line x1="150" y1="160" x2="100" y2="240" class="edge" />
  <line x1="150" y1="160" x2="200" y2="240" class="edge" />
  
  <line x1="350" y1="160" x2="300" y2="240" class="edge" />
  <line x1="350" y1="160" x2="400" y2="240" class="edge" />

  <!-- Nodes (Parent & Children) -->
  <!-- Level 0 -->
  <circle cx="250" cy="80" r="22" class="node-bg" />
  <text x="250" y="85" class="node-text">50</text>
  
  <!-- Level 1 -->
  <circle cx="150" cy="160" r="22" class="node-bg" />
  <text x="150" y="165" class="node-text">30</text>
  
  <circle cx="350" cy="160" r="22" class="node-bg" />
  <text x="350" y="165" class="node-text">70</text>
  
  <!-- Level 2 -->
  <circle cx="100" cy="240" r="22" class="node-bg" />
  <text x="100" y="245" class="node-text">20</text>
  
  <circle cx="200" cy="240" r="22" class="node-bg" />
  <text x="200" y="245" class="node-text">40</text>
  
  <circle cx="300" cy="240" r="22" class="node-bg" />
  <text x="300" y="245" class="node-text">60</text>
  
  <circle cx="400" cy="240" r="22" class="node-bg" />
  <text x="400" y="245" class="node-text">80</text>

  <!-- Formulas / Commentary details -->
  <text x="30" y="310" class="commentary">// BST Property: Left &lt; Root &lt; Right</text>
  <text x="30" y="325" class="commentary">// Inorder traversal yields sorted output: [20, 30, 40, 50, 60, 70, 80]</text>
</svg>
