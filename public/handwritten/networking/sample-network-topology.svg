<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <style>
    .bg { fill: #0d0905; }
    .grid-line { stroke: #ffffff; stroke-opacity: 0.02; stroke-width: 1; }
    .edge { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 5 3; }
    .hub { fill: #292524; stroke: #ea580c; stroke-width: 2.5; rx: 8; ry: 8; }
    .node { fill: #1c1917; stroke: #d97706; stroke-width: 2; }
    .cloud { fill: #2d1d11; stroke: #d97706; stroke-width: 2.5; }
    .text { fill: #f5f5f4; font-family: 'Courier New', Courier, monospace; font-size: 11px; text-anchor: middle; font-weight: bold; }
    .title { fill: #ea580c; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: bold; letter-spacing: 1.5px; }
    .commentary { fill: #a8a29e; font-family: 'Courier New', Courier, monospace; font-size: 11px; }
  </style>
  
  <rect width="100%" height="100%" class="bg" rx="16" />
  
  <!-- Grid -->
  <g>
    <line x1="50" y1="0" x2="50" y2="350" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="350" class="grid-line" />
    <line x1="250" y1="0" x2="250" y2="350" class="grid-line" />
    <line x1="350" y1="0" x2="350" y2="350" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="350" class="grid-line" />
    <line x1="0" y1="50" x2="500" y2="50" class="grid-line" />
    <line x1="0" y1="150" x2="500" y2="150" class="grid-line" />
    <line x1="0" y1="250" x2="500" y2="250" class="grid-line" />
  </g>

  <!-- Title -->
  <text x="30" y="40" class="title">NETWORKING: STAR NETWORK TOPOLOGY</text>
  
  <!-- Edges -->
  <line x1="250" y1="180" x2="150" y2="100" class="edge" />
  <line x1="250" y1="180" x2="350" y2="100" class="edge" />
  <line x1="250" y1="180" x2="120" y2="230" class="edge" />
  <line x1="250" y1="180" x2="380" y2="230" class="edge" />
  <line x1="250" y1="180" x2="250" y2="70" class="edge" />

  <!-- Center Hub Switch -->
  <rect x="210" y="155" width="80" height="50" class="hub" />
  <text x="250" y="180" class="text">SWITCH</text>
  <text x="250" y="195" class="text">HUB</text>

  <!-- Nodes (Workstations / Printers) -->
  <circle cx="150" cy="100" r="24" class="node" />
  <text x="150" y="104" class="text">Node A</text>
  
  <circle cx="350" cy="100" r="24" class="node" />
  <text x="350" y="104" class="text">Node B</text>

  <circle cx="120" cy="230" r="24" class="node" />
  <text x="120" y="234" class="text">Node C</text>
  
  <circle cx="380" cy="230" r="24" class="node" />
  <text x="380" y="234" class="text">Printer</text>

  <!-- Internet Cloud Connection -->
  <path d="M 220,70 A 20,20 0 0,1 250,55 A 25,25 0 0,1 280,70 A 15,15 0 0,1 270,85 L 230,85 A 15,15 0 0,1 220,70 Z" class="cloud" />
  <text x="250" y="77" class="text" style="font-size: 8px;">Internet</text>

  <!-- Commentary -->
  <text x="30" y="305" class="commentary">// Star Topology: Central Hub manages all packet transmission</text>
  <text x="30" y="320" class="commentary">// Single Point of Failure (If Hub fails, whole network goes down)</text>
</svg>
